# GoReleaser configuration for Gaia
# See: https://goreleaser.com

version: 2

project_name: gaia

before:
  hooks:
    - go mod tidy
    - make protoc  # Generate protobuf code before build

builds:
  - id: gaia
    dir: apps/gaia
    main: .
    binary: gaia
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Set version info
    ldflags:
      - -s -w
      - -X github.com/stain-win/gaia/apps/gaia/cmd.version={{.Version}}
      - -X github.com/stain-win/gaia/apps/gaia/cmd.gitCommit={{.Commit}}
      - -X github.com/stain-win/gaia/apps/gaia/cmd.buildDate={{.Date}}

archives:
  - id: gaia-archive
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - documentation/*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - '^build:'
  groups:
    - title: 'New Features'
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug Fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: 'Security Updates'
      regexp: "^.*sec[(\\w)]*:+.*$"
      order: 2
    - title: 'Other Changes'
      order: 999

release:
  github:
    owner: stain-win
    name: gaia
  draft: false
  prerelease: auto
  name_template: "Gaia {{.Version}}"
  header: |
    ## Gaia {{.Version}}
    
    Lightweight, secure, self-hosted secrets management daemon.
    
    ### Installation
    
    Download the appropriate binary for your system below, extract it, and add it to your PATH.
    
    ### What's Changed
  footer: |
    ---
    
    **Full Changelog**: https://github.com/stain-win/gaia/compare/{{ .PreviousTag }}...{{ .Tag }}
    
    ### Verifying Downloads
    
    All binaries are checksummed. Verify with:
    ```bash
    sha256sum -c checksums.txt
    ```
    
    Released by [GoReleaser](https://github.com/goreleaser/goreleaser)
