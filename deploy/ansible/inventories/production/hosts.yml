---
# Production Inventory for Gaia Deployment
#
# Configure your production servers here.
# For more complex setups, you can split into multiple groups.

all:
  children:
    gaia_servers:
      hosts:
        # Single server example
        gaia-prod-01:
          ansible_host: 192.168.1.100
          ansible_user: ubuntu
          ansible_become: true
          # ansible_ssh_private_key_file: ~/.ssh/gaia-prod-key

        # Add more servers as needed
        # gaia-prod-02:
        #   ansible_host: 192.168.1.101
        #   ansible_user: ubuntu
        #   ansible_become: true

      vars:
        # Override defaults for all production servers
        gaia_log_level: "info"
        gaia_audit_enabled: true

        # Security: Configure firewall to allow specific IPs only
        # gaia_configure_firewall: true
        # gaia_firewall_allowed_ips:
        #   - 10.0.1.0/24      # Application subnet
        #   - 192.168.1.50     # Admin workstation
