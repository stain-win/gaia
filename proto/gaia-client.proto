syntax = "proto3";

package gaia;

option go_package = "github.com/stain-win/gaia/libs/go/proto";

import "google/protobuf/empty.proto";

service GaiaClient {
  rpc GetSecret(GetSecretRequest) returns (Secret);
  // New: ListSecrets returns all secrets for the authenticated client plus common when not filtered.
  rpc ListSecrets(ClientListSecretsRequest) returns (ListSecretsResponse);
}

message Secret {
  string id = 1;
  string value = 2;
}

// A Namespace contains a collection of secrets.
message Namespace {
  string name = 1;
  repeated Secret secrets = 2;
}

message GetSecretRequest {
  string namespace = 1; // Namespace to which the secret belongs
  string id = 2;
}

message ClientListSecretsRequest {
  string namespace = 1; // optional filter; empty => all client namespaces + common
}

message ListSecretsResponse {
  repeated Namespace namespaces = 1;
}
