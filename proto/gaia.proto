syntax = "proto3";

package gaia;

option go_package = "github.com/stain-win/gaia/apps/gaia/proto";

service GaiaAdmin {
  rpc AddSecret(AddSecretRequest) returns (AddSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc Unlock(UnlockRequest) returns (UnlockResponse);
  rpc Lock(LockRequest) returns (LockResponse);
  rpc RegisterClient(RegisterClientRequest) returns (RegisterClientResponse);
  rpc ListClients(ListClientsRequest) returns (ListClientsResponse);
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
  rpc RevokeClient(RevokeClientRequest) returns (RevokeClientResponse);
  rpc ImportSecrets(stream ImportSecretsRequest) returns (ImportSecretsResponse);
  rpc ListSecretsStream(ListSecretsRequest) returns (stream ListSecretsStreamResponse);

  // Policy management
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  rpc SetPolicy(SetPolicyRequest) returns (SetPolicyResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
}

service GaiaClient {
  rpc GetSecret(GetSecretRequest) returns (Secret);
  // ListSecrets returns all secrets for the authenticated client (derived from mTLS certificate).
  // If namespace is provided, only secrets from that namespace are returned.
  // The special "common" namespace is always included when namespace is empty or explicitly set to "common".
  rpc ListSecrets(ClientListSecretsRequest) returns (ListSecretsResponse);
}

message Secret {
  string id = 1;
  string value = 2;
}

message Namespace {
  string name = 1;
  repeated Secret secrets = 2;
}

message AddSecretRequest {
  string namespace = 1;
  string id = 2;
  string value = 3;
  string client_name = 4; // Add this field for the admin
}

message AddSecretResponse {
  bool success = 1;
  string message = 2;
}

message GetSecretRequest {
  string namespace = 1;
  string id = 2;
}

message ClientListSecretsRequest {
  string namespace = 1; // optional filter; empty returns all namespaces for client + common
}

message GetStatusRequest {}

message GetStatusResponse {
  string status = 1;
}

message StopRequest {}

message StopResponse {
  bool success = 1;
}

message UnlockRequest {
  string passphrase = 1;
}

message UnlockResponse {
  bool success = 1;
}

message LockRequest {}

message LockResponse {
  bool success = 1;
}

message RegisterClientRequest {
  string client_name = 1;
}

message RegisterClientResponse {
  string certificate = 1; // PEM-encoded cert
  string private_key = 2; // PEM-encoded key
}

message Client {
  string id = 1;
  string name = 2;
  string status = 3;
  string time_created = 4;
}

message ListClientsRequest {}

message ListClientsResponse {
  repeated Client clients = 1;
}

message ListNamespacesRequest {
  string client_name = 1;
}
message ListNamespacesResponse {
  repeated string namespaces = 1;
}

message RevokeClientRequest {
  string client_name = 1;
}

message RevokeClientResponse {
  bool success = 1;
}

message DeleteSecretRequest {
  string client_name = 1;
  string namespace = 2;
  string id = 3;
}

message DeleteSecretResponse {
  bool success = 1;
}

message ImportSecretsConfig {
  bool overwrite = 1;
}

message ImportSecretItem {
  string client_name = 1;
  string namespace = 2;
  string id = 3;
  string value = 4;
}

// Wrapper message for the stream to handle config and items
message ImportSecretsRequest {
  oneof payload {
    ImportSecretsConfig config = 1;
    ImportSecretItem item = 2;
  }
}

message ImportSecretsResponse {
  int32 secrets_imported = 1;
  string message = 2;
}

message ListSecretsResponse {
  repeated Namespace namespaces = 1;
}

message ListSecretsRequest {
  string client_name = 1;
}

message ListSecretsStreamResponse {
  string namespace = 1;
  Secret secret = 2;
}

// Policy messages
message Policy {
  string client_name = 1;
  repeated PolicyRule rules = 2;
}

message PolicyRule {
  string path = 1;
  repeated string capabilities = 2;
  string description = 3;
}

message ListPoliciesRequest {}

message ListPoliciesResponse {
  repeated Policy policies = 1;
}

message GetPolicyRequest {
  string client_name = 1;
}

message GetPolicyResponse {
  Policy policy = 1;
}

message SetPolicyRequest {
  Policy policy = 1;
}

message SetPolicyResponse {
  bool success = 1;
  string message = 2;
}

message DeletePolicyRequest {
  string client_name = 1;
}

message DeletePolicyResponse {
  bool success = 1;
  string message = 2;
}
