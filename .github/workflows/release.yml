name: Release Gaia

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for cosign keyless signing (OIDC identity token).
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          # Pinned: sign-blob --bundle --new-bundle-format behaviour must stay
          # deterministic; bump deliberately alongside client-side verification.
          cosign-release: 'v2.5.0'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-libs-changes:
    name: Check for libs changes
    runs-on: ubuntu-latest
    outputs:
      libs_changed: ${{ steps.changes.outputs.libs_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes in libs directory
        id: changes
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, will publish libs"
            echo "libs_changed=true" >> $GITHUB_OUTPUT
          else
            # Check if there are any changes in libs/ between previous tag and current tag
            CHANGES=$(git diff --name-only $PREVIOUS_TAG HEAD -- libs/ || echo "changed")
            
            if [ -n "$CHANGES" ]; then
              echo "Changes detected in libs/ directory:"
              echo "$CHANGES"
              echo "libs_changed=true" >> $GITHUB_OUTPUT
            else
              echo "No changes in libs/ directory, skipping library publishing"
              echo "libs_changed=false" >> $GITHUB_OUTPUT
            fi
          fi

  publish-npm:
    name: Publish to npm
    needs: [release, check-libs-changes]
    if: needs.check-libs-changes.outputs.libs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Install dependencies
        working-directory: ./libs/js
        run: npm ci

      - name: Update package version
        working-directory: ./libs/js
        run: |
          npm version ${{ steps.get_version.outputs.VERSION }} --no-git-tag-version --allow-same-version
          echo "Updated package.json to version ${{ steps.get_version.outputs.VERSION }}"

      - name: Build package
        working-directory: ./libs/js
        run: npm run build

      - name: Determine npm dist-tag
        id: npm_tag
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        working-directory: ./libs/js
        run: npm publish --access public --tag ${{ steps.npm_tag.outputs.tag }}

  publish-crates:
    name: Publish to crates.io
    needs: [release, check-libs-changes]
    if: needs.check-libs-changes.outputs.libs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Copy proto file to Rust lib
        run: |
          echo "Copying proto file to libs/rust/proto/"
          mkdir -p libs/rust/proto
          cp proto/gaia-client.proto libs/rust/proto/
          echo "✓ Proto file copied"

      - name: Regenerate proto code
        working-directory: ./libs/rust
        run: |
          echo "Regenerating Rust proto code..."
          REGENERATE_PROTO=1 cargo build --features regenerate-proto
          echo "✓ Proto code generated"

      - name: Copy generated proto to source
        working-directory: ./libs/rust
        run: |
          echo "Copying generated proto code to src/proto.rs..."
          PROTO_FILE=$(find target/debug/build/gaia-client-*/out/gaia.rs -type f | head -1)
          if [ -n "$PROTO_FILE" ]; then
            cp "$PROTO_FILE" src/proto.rs
            echo "✓ Generated proto copied to src/proto.rs"
          else
            echo "✗ Error: Generated proto file not found"
            exit 1
          fi

      - name: Verify proto code is current
        working-directory: ./libs/rust
        run: |
          echo "Verifying proto code is up-to-date..."
          if git diff --quiet src/proto.rs; then
            echo "✓ Proto code is current"
          else
            echo "⚠ Proto code was regenerated (this is expected during release)"
            git diff src/proto.rs
          fi

      - name: Update Cargo.toml version
        working-directory: ./libs/rust
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.get_version.outputs.VERSION }}"/' Cargo.toml
          echo "Updated Cargo.toml to version ${{ steps.get_version.outputs.VERSION }}"
          grep "^version" Cargo.toml

      - name: Build package
        working-directory: ./libs/rust
        run: cargo build --release

      - name: Run tests
        working-directory: ./libs/rust
        run: cargo test

      - name: Commit release artifacts locally
        working-directory: ./libs/rust
        run: |
          # The version bump, proto sync, and Cargo.lock update above are
          # deliberate, expected changes for this release. `cargo publish`
          # refuses to run from a dirty git tree, so commit them locally
          # (no push needed - cargo only checks the local working tree)
          # instead of bypassing the check with --allow-dirty.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock proto/gaia-client.proto src/proto.rs
          if git diff --cached --quiet; then
            echo "No release artifacts changed, nothing to commit"
          else
            git commit -m "chore(release): sync generated artifacts for v${{ steps.get_version.outputs.VERSION }}"
          fi

      - name: Publish to crates.io
        working-directory: ./libs/rust
        run: cargo publish --token ${{ secrets.CARGO_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

