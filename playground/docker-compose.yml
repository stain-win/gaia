version: '3.8'

services:
  gaia:
    build:
      context: ..
      dockerfile: playground/Dockerfile.gaia
    ports:
      - "50051:50051"
    environment:
      - GAIA_PASSPHRASE=supersecretplaygroundpassword!123
    volumes:
      - gaia_data:/var/lib/gaia
      - gaia_certs:/etc/gaia/certs

  web:
    build:
      context: ..
      dockerfile: playground/web/Dockerfile
    user: "root"
    ports:
      - "3000:3000"
    environment:
      # Pass the address of the Gaia daemon, pointing to its container name
      - GAIA_ADDRESS=gaia:50051
      # Also pass paths to cert files; since we share gaia_certs, we can access them
      - GAIA_CA_CERT=/etc/gaia/certs/ca.crt
      - GAIA_CLIENT_CERT=/etc/gaia/certs/gaia_client.crt
      - GAIA_CLIENT_KEY=/etc/gaia/certs/gaia_client.key
    volumes:
      - gaia_certs:/etc/gaia/certs:ro
    depends_on:
      - gaia

volumes:
  gaia_data:
  gaia_certs:
